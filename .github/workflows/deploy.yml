name: Hub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping swaps would race over the same dist
  # directory and could leave the previous build in place while reporting
  # success.
  group: hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Builds on pull requests too, so a broken build is caught before it is
      # merged rather than on the server afterwards.
      - run: npx vite build

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Build and swap on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" || true
            APP_PATH=/var/www/agendamoney/frontend-hub
            # The pull happens here rather than in the script, because the script
            # is itself pulled: left inside, the first run of any change to it
            # would execute the previous version, and a brand new checkout would
            # have no script to call at all.
            cd "$APP_PATH"
            git fetch origin
            git reset --hard origin/main
            # Everything past here runs under an explicit bash. This block is fed
            # to the login shell, which is zsh, and a parse error there would
            # reject the whole thing before any of it ran — so keep what stays
            # here boring.
            bash "$APP_PATH/.github/scripts/deploy-hub.sh" "$APP_PATH"
