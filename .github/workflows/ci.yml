# Continuous integration for the hub.
#
# The hub deploys to Vercel straight off main, so until now nothing ran
# between a push and production. This is the gate that was missing.
#
# Two jobs, deliberately split by whether they can be trusted to be green.
# `verify` blocks: tests and the production build both pass today, so a red
# one means something broke just now and is worth stopping for. `quality`
# reports without blocking: the repo carries 591 lint errors and 13 type
# errors that predate this workflow, and a gate that is red from the day it
# is created teaches everyone to ignore it. Tighten each one as the backlog
# comes down — the point is that the number is visible and can only be
# argued about once it is.

name: Hub CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no value in finishing a run for a commit
# that is already stale.
concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ci, not install: builds from the lockfile exactly, so a run cannot
      # quietly pass on a dependency tree that nobody has locally.
      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      # The gate that actually protects production. Vercel runs this same
      # command on main, so a failure here is a failure to deploy — and
      # because `vite build` does not typecheck, this catches things the
      # typecheck below cannot, and misses things it does.
      - name: Build
        run: npm run build

  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Both are non-blocking for now: 13 type errors and 591 lint errors
      # predate this file. Remove continue-on-error once each reaches zero,
      # starting with the typecheck — it is much the smaller of the two.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true
